name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # The tests use a fake detector, so the heavy YOLO / PyTorch install is not needed here.
      - run: pip install numpy opencv-python-headless flask
      - run: python -m unittest discover -s tests -v
